<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>記事一覧</title>
        <link rel="icon" href="../cgls/favicon.ico" />
        
		
        <link rel="stylesheet" href="list/list.css">
        <link rel="stylesheet" href="../css/main.css" />
        <link rel="stylesheet" href="../css/toppage.css" />
        
        <!-- googleのフォントを使う -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
        
        
        <!-- jQueryのインクルード -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <!-- OGP -->
        <meta name="description" content="クリエイティブスタッフの記事の一覧です。作者で並べ替え・絞り込みができます。" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="CreativeStaff" />
        <meta property="og:locale" content="ja_JP" />
        <meta property="og:title" content="記事一覧 | CreativeStaff" />
        <meta property="og:description" content="クリエイティブスタッフの記事の一覧です。作者で並べ替え・絞り込みができます。" />
        <meta property="og:url" content="https://www.creative-staff.com/articles/list.html" />
        <meta property="og:image" content="https://www.creative-staff.com/cgls/ogp.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@creative_staff" />
        <link rel="canonical" href="https://www.creative-staff.com/articles/list.html" />
    </head>
    <body>
        <!-- ヘッダー -->
        <div id="header"></div>
        
        <div id="content-main" class="page">
			<h1>記事一覧</h1>
			<div id="controls" class="ls-controls">
				<label>並び順
					<select id="sort">
						<option value="new">新しい順</option>
						<option value="old">古い順</option>
						<option value="author">作者別</option>
					</select>
				</label>
				<label>作者
					<select id="author"><option value="">すべて</option></select>
				</label>
				<span id="count" class="ls-count"></span>
			</div>
			<div id="list" class="ls-list"><p class="ls-empty">読み込み中...</p></div>
		</div>
        <!-- フッター -->
        <div id="footer"></div>

        <script src="../js/main.js" charset="utf-8"></script>
        <script src="../js/cre_navigation.js" charset="utf-8"></script>
        <script src="list/list.js" charset="utf-8"></script>
		<script src="https://apis.google.com/js/platform.js" async defer></script>
    </body>
</html>
