<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CreativeStaff</title>
        <link rel="icon" href="../cgls/favicon.ico" />

        <link rel="stylesheet" href="games.css">
        <link rel="stylesheet" href="../css/main.css" />
        <link rel="stylesheet" href="../css/toppage.css" />

        <!-- googleのフォントを使う -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />


        <!-- jQueryのインクルード -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- なんかわからんけどスライダーに必要 -->
        <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
        <!-- OGP -->
        <meta name="description" content="クリエイティブスタッフのメンバーが制作したゲームの一覧です。ブラウザで遊べる作品やダウンロードできる作品を公開しています。" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="CreativeStaff" />
        <meta property="og:locale" content="ja_JP" />
        <meta property="og:title" content="ゲーム一覧 | CreativeStaff" />
        <meta property="og:description" content="クリエイティブスタッフのメンバーが制作したゲームの一覧です。ブラウザで遊べる作品やダウンロードできる作品を公開しています。" />
        <meta property="og:url" content="https://www.creative-staff.com/games/games.html" />
        <meta property="og:image" content="https://www.creative-staff.com/cgls/ogp.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@creative_staff" />
        <link rel="canonical" href="https://www.creative-staff.com/games/games.html" />
    </head>
    <body>
        <!-- ヘッダー -->
        <div id="header"></div>

        <!-- 詳細ポップアップ(中身は games.js が作る) -->
        <div class="pop_mode" id="pop-mode"></div>

        <div id="content-main" class="page">
            <!-- ゲームランチャーの配布。ファイル名を変えたときは、下の href の末尾だけ直す -->
            <div class="launcher-banner">
                <div class="launcher-banner__text">
                    <span class="launcher-banner__title">ゲームランチャー</span>
                    <span class="launcher-banner__desc">サークルのゲームをあそんだりできる専用アプリです。人気順に並び替えたり、ゆかいな機能つき！</span>
                    <span class="launcher-banner__note">Windows 10 / 11 対応(パソコン用です)</span>
                </div>
                <a class="launcher-banner__btn" href="https://cs-launcher-api.akane-minori-cslauncher.workers.dev/%E3%82%AF%E3%83%AA%E3%82%A8%E3%82%A4%E3%83%86%E3%82%A3%E3%83%96%E3%82%B9%E3%82%BF%E3%83%83%E3%83%95%E3%83%BB%E3%82%B2%E3%83%BC%E3%83%A0%E3%83%A9%E3%83%B3%E3%83%81%E3%83%A3%E3%83%BC%EF%BC%88R2%EF%BC%89.zip" download><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>ランチャーをダウンロード</a>
            </div>

            <p><red>注意!! 一部ゲームはバグにより不自然な挙動、進行不能になる可能性があります。</red></p>
            <p style="text-align: center;">絞り込み</p>
            <div class="search_area list">
                <form id="selectForm">
                    <div class="search_ui size_search_box pc">
                        <!-- 絞り込みのチェックボックスは games.js が作る -->
                        <span id="sizeBox"></span>
                    </div>
                </form>
            </div>
            <br>

            <h1>Games</h1>
            <!-- ゲームカードは games.js が作る -->
            <div class="Games" id="games-grid">
                <p>読み込み中...</p>
            </div>
            <p id="games-empty" hidden>該当するゲームがありません。</p>
        </div>

        <!-- フッター -->
        <div id="footer"></div>

        <script src="../js/main.js" charset="utf-8"></script>
        <script src="../js/cre_navigation.js" charset="utf-8"></script>
        <script src="games.js" charset="utf-8"></script>
    </body>

</html>
